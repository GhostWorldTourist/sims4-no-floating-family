name: release

# Publishes a tagged build to Nexus Mods.
#
# The Nexus upload API is update-only: the mod page must already exist and have
# had at least one file uploaded by hand. This workflow replaces that file with
# a new version - it cannot create the page.
#
# Until that page exists the upload is SKIPPED, not failed. "No Nexus page yet"
# is a normal state for a new mod, and a workflow that goes red for it teaches
# people to ignore red. The last step always runs and says which happened, so a
# skip can never be mistaken for a publish.
#
# The action is pinned to an exact beta tag. There is no `v1` to float on - the
# upload API is itself in open beta - and GitHub resolves every action at job
# setup, before any `if:` runs, so an unresolvable ref fails the whole job even
# when the step that uses it would have been skipped.
#
# Before the first real run, set:
#   secret  NEXUSMODS_API_KEY  - from your Nexus account API keys page
#   var     NEXUS_FILE_ID      - Files tab -> API Info on the live mod page
#   var     NEXUS_MOD_ID       - NOT the number in the mod URL. That is the
#                                game-scoped id. Resolve the real one via
#                                https://api.nexusmods.com/v3/games/thesims4/mods/<url-number>
#                                and take the `id` field. Only needed for changelogs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Never publish a package that does not pass its own check, even on a tag.
      - name: Verify before publishing
        run: python verify.py

      - name: Work out whether Nexus is configured
        id: cfg
        env:
          FILE_ID: ${{ vars.NEXUS_FILE_ID }}
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -n "$FILE_ID" ] && [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -j "NoFloatingFamily-$VERSION.zip" \
            GhostWorldTourist_NoFloatingFamilyInMainMenu.package README.md
          echo "ARCHIVE=NoFloatingFamily-$VERSION.zip" >> "$GITHUB_ENV"

      # Keeps a downloadable build against every tag, even before Nexus exists.
      - name: Attach the archive to this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

      - name: Upload to Nexus Mods
        id: nexus
        if: steps.cfg.outputs.ready == 'true'
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          filename: ${{ env.ARCHIVE }}
          version: ${{ env.VERSION }}
          display_name: No Floating Family ${{ env.VERSION }}
          category: main
          update_mod_version: true
          archive_existing_version: true

      # Always runs, so a skip is never mistaken for a publish.
      - name: Say what happened
        run: |
          if [ "${{ steps.cfg.outputs.ready }}" = "true" ]; then
            echo "Published to Nexus. version_id=${{ steps.nexus.outputs.version_id }}"
          else
            echo "NOT published to Nexus - it is not configured yet."
            echo "The built archive is attached to this run as an artifact."
            echo "To enable: create the mod page, upload the first file by hand,"
            echo "then set the NEXUSMODS_API_KEY secret and NEXUS_FILE_ID variable."
          fi
